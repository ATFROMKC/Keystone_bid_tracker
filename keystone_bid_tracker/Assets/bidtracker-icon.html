<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BidTracker Icon Sources</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;500&display=swap" rel="stylesheet">
<style>
body{background:#0a0a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;gap:20px;color:#e1f5fe;font-family:'DM Sans',sans-serif;}
h1{font-size:22px;font-weight:500;letter-spacing:.06em;margin:0;}
.sub{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.65;}
.row{display:flex;gap:64px;align-items:flex-start;}
.card{display:flex;flex-direction:column;align-items:center;gap:12px;}
.preview{width:220px;height:220px;background:#121827;border-radius:18px;padding:18px;box-sizing:border-box;border:1px solid rgba(79,195,247,.25);}
.label{font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;}
</style>
</head>
<body>
  <h1>BidTracker Icon Source Files</h1>
  <div class="sub">Canonical SVGs for runtime + packaged assets</div>
  <div class="row">
    <div class="card">
      <img class="preview" src="./icons/bidtracker-full.svg" alt="Full icon variant">
      <div class="label">Full Variant (48+)</div>
      <div class="sub">`icons/bidtracker-full.svg`</div>
    </div>
    <div class="card">
      <img class="preview" src="./icons/bidtracker-small.svg" alt="Small icon variant">
      <div class="label">Small Variant (16/24/32)</div>
      <div class="sub">`icons/bidtracker-small.svg`</div>
    </div>
  </div>
</body>
</html>
